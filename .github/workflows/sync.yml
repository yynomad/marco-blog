name: Sync Notion & Deploy

concurrency:
  group: notion-blog-sync
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * *'     # 每天北京时间 14:00 (UTC 6:00) 跑一次
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: '只检查 R2 配置和存储桶认证，不同步文章'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Sync from Notion
        id: sync
        if: inputs.diagnose_only != true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: npm run sync

      - name: Diagnose R2 credentials
        if: inputs.diagnose_only == true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node tools/check-r2.js

      - name: Commit & Push changes
        if: always() && !cancelled() && steps.sync.outcome != 'skipped'
        run: |
          git config user.name "notion-bot"
          git config user.email "notion-bot@github.com"
          git add source/_posts/
          git diff --staged --quiet || git commit -m "📝 auto sync from Notion"
          git push
